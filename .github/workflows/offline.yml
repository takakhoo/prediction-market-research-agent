name: Offline contracts and replay
on: [push, pull_request, workflow_dispatch]
jobs:
  offline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements-offline.txt
      - run: python -m pytest -q
      - run: python scripts/offline_replay.py && git diff --exit-code -- results/offline-replay.json
